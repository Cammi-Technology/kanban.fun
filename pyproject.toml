[project]
name = "kanban-fun"
version = "0.1.0"
description = "Kanban.fun: account-scoped projects, posts, comments and mentions, built on Django."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "django>=6.1,<6.2",
    "htpy>=26.5",
    "channels>=4.3",
    "daphne>=4.2",
    "steady-queue>=0.2.1",
    "pyotp>=2.10",
    "qrcode>=8.2",
    "pywebpush>=2.5",
    "authlib>=1.8",
    "requests>=2.32",
    "whitenoise>=6.12",
    "markupsafe>=3.0",
    "django-stubs-ext>=6.1",
    "cryptography>=45",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1",
    "mypy>=2.3",
    "ruff>=0.16",
    "pytest>=8",
    "pytest-django>=4.14",
    "pytest-asyncio>=1.4",
    "pytest-playwright>=0.9",
    "playwright>=1.63",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["node_modules", "static/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF", "ANN", "PT", "C4", "PL"]
ignore = [
    "ANN401",   # Any is sometimes the honest type at the Django boundary
    "PLR0913",  # view helpers take several keyword arguments
    "PLR2004",  # magic values are fine in tests and HTTP status checks
    "PLR0911",  # views return early for each outcome
    "PLR0917",  # component functions take several positional arguments
    "S101",     # assert is how pytest works
    "RUF012",   # Django Meta/admin class attributes
    "PLC0415",  # deliberate lazy imports break app-level import cycles
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "PLR0915", "ANN", "PT018", "PT012", "E501"]
"**/migrations/**" = ["E501", "RUF", "I001"]
"kanban/ui/icons.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
exclude = ["node_modules/", "static/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "steady_queue.*",
    "pywebpush.*",
    "authlib.*",
    "qrcode.*",
    "daphne.*",
    "channels.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers -p no:cacheprovider -m \"not system\""
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "system: end-to-end browser tests against a real Daphne server and worker",
]
filterwarnings = [
    "error::django.utils.deprecation.RemovedInNextVersionWarning",
]
